databases:
  - name: gestion-invitados-db
    plan: free
    databaseName: gestion_invitados
    user: gestion_invitados

services:
  - type: web
    name: gestion-invitados
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-invitados-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: NODE_VERSION
        value: 20.18.0
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: gestion-invitados-reminders
    runtime: node
    plan: free
    schedule: "0 14 * * *"
    buildCommand: "true"
    startCommand: >-
      node -e "fetch(process.env.CRON_URL,{method:'POST',headers:{Authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>r.text()).then(t=>console.log(t))"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: gestion-invitados
          type: web
          envVarKey: CRON_SECRET
      - key: CRON_URL
        sync: false
