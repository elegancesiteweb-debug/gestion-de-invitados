databases:
  - name: gestion-invitados-db
    plan: free
    databaseName: gestion_invitados
    user: gestion_invitados

services:
  - type: web
    name: gestion-invitados
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-invitados-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: NODE_VERSION
        value: 20.18.0
